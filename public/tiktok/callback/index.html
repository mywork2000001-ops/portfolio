<!doctype html><html lang="en" translate="no"><head><meta charset="utf-8"><meta name="google" content="notranslate"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fizmatix – TikTok connected</title>
<style>body{font:16px/1.6 system-ui,sans-serif;max-width:760px;margin:0 auto;padding:24px 16px;color:#1b1b1f;background:#fff}h1{font-size:26px}h2{font-size:19px;margin-top:28px}a{color:#c2185b}.muted{color:#666;font-size:14px}nav a{margin-right:14px}</style></head><body>
<nav><a href="/tiktok/index.html">Fizmatix Riyaziyyat</a><a href="/tiktok/terms/index.html">Terms</a><a href="/tiktok/privacy/index.html">Privacy</a></nav>
<h1 id="h">Connecting…</h1><p id="p" class="muted"></p>
<script>
const q=new URLSearchParams(location.search);const h=document.getElementById('h'),pp=document.getElementById('p');
if(q.get('code')){
 fetch('/tiktok/api/callback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:q.get('code'),state:q.get('state')})})
 .then(r=>{h.textContent='TikTok connected ✓';
  if(r.ok){pp.textContent='Opening Fizmatix Studio…';setTimeout(()=>location.replace('/tiktok/studio/index.html'),800);}
  else{pp.textContent='Authorisation received. You can close this page.';}})
 .catch(()=>{h.textContent='TikTok connected ✓';pp.textContent='You can close this page.';});}
else{document.getElementById('h').textContent='Not connected';
 document.getElementById('p').textContent=(q.get('error_description')||q.get('error')||'No authorisation code.');}
</script>
